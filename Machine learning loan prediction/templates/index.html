<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loan Prediction Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    background: radial-gradient(circle at top, #0f2027, #000000);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Card */
.card {
    width: 420px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 40px rgba(0,255,255,0.15);
    animation: fadeIn 1s ease-in-out;
}

/* Title */
h2 {
    text-align: center;
    color: #00ffff;
    margin-bottom: 25px;
    letter-spacing: 1px;
}

/* Labels */
label {
    font-size: 13px;
    color: #bbb;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 10px;
    margin: 6px 0 14px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #fff;
    transition: 0.3s;
}

/* Focus Effect */
input:focus, select:focus {
    outline: none;
    box-shadow: 0 0 10px #00ffff;
    transform: scale(1.02);
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

/* Button Hover */
button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00c6ff;
}

/* Result Card */
.result {
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
    animation: fadeIn 0.7s ease-in-out;
}

/* Approved */
.approved {
    background: rgba(0,255,100,0.15);
    color: #00ff88;
    box-shadow: 0 0 10px rgba(0,255,100,0.4);
}

/* Rejected */
.rejected {
    background: rgba(255,0,0,0.15);
    color: #ff4d4d;
    box-shadow: 0 0 10px rgba(255,0,0,0.4);
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="card">

<h2>💰 Loan Prediction</h2>

<form action="/predict" method="post">
<h2>{{ result }}</h2>
<h3>Loan Amount: ₹ {{ amount }}</h3>

<label>Gender</label>
<select name="gender">
<option>Male</option>
<option>Female</option>
</select>

<label>Married</label>
<select name="married">
<option>Yes</option>
<option>No</option>
</select>

<label>Dependents</label>
<input type="text" name="dependents">


<label>Self Employed</label>
<select name="self_emp">
<option>Yes</option>
<option>No</option>
</select>

<label>Income</label>
<input type="number" name="income">



<label>Credit History</label>
<input type="number" name="credit">

<label>Property Area</label>
<select name="property_area">
<option>Urban</option>
<option>Semiurban</option>
<option>Rural</option>
</select>

<button type="submit">🚀 Predict</button>

</form>

{% if result %}
<div class="result {% if 'Approved' in result %}approved{% else %}rejected{% endif %}">
    <p>{{ result }}</p>
    <p>💸 Loan Amount: {{ amount }}</p>
</div>
{% endif %}

</div>

</body>
</html>
